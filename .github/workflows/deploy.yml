name: Build and Deploy to gh-pages

on:
  push:
    branches: ["claude/steady-inventory-app-FEc00"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/steady-inventory-app-FEc00

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Patch expo-font ExpoFontLoader.web.js
        run: |
          TARGET=node_modules/expo-font/build/ExpoFontLoader.web.js
          if [ ! -f "$TARGET" ]; then echo "NOT FOUND: $TARGET"; find node_modules/expo-font/build -name "*.js" | head -10; exit 0; fi
          node -e "
          var fs=require('fs');
          var code='const _loaded={};\nexport default {\n  loadAsync(name,resource){\n    return new Promise((resolve)=>{\n      var url=typeof resource==="string"?resource:(resource&&resource.uri?resource.uri:null);\n      if(!url){_loaded[name]=true;return resolve();}\n      var style=document.createElement("style");\n      style.textContent="@font-face{font-family:\'"+ name +"\';src:url(\'"+ url +"\')}";\n      document.head.appendChild(style);\n      document.fonts.load("1em "+name).then(()=>{_loaded[name]=true;resolve();}).catch(()=>{_loaded[name]=true;resolve();});\n    });\n  },\n  isLoaded(name){return !!_loaded[name];},\n  unloadAllAsync(){return Promise.resolve();},\n  getLoadedFonts(){return Object.keys(_loaded);},\n};\n';
          fs.writeFileSync('node_modules/expo-font/build/ExpoFontLoader.web.js',code);
          console.log('Patched ExpoFontLoader.web.js');
          "

      - name: Build Expo web
        run: npx expo export -p web --output-dir /tmp/web-build --clear
        env:
          CI: "false"

      - name: Patch asset paths
        run: |
          cd /tmp/web-build
          JS=$(find _expo/static/js/web -name "AppEntry-*.js" 2>/dev/null | head -1)
          if [ -n "$JS" ]; then
            sed -i 's|"/assets/|"/Steady/assets/|g' "$JS"
            sed -i 's|"/_expo/|"/Steady/_expo/|g' "$JS"
          fi
          sed -i 's|src="/_expo/|src="_expo/|g' index.html
          sed -i 's|href="/_expo/|href="_expo/|g' index.html
          sed -i 's|href="/assets/|href="assets/|g' index.html

      - name: Deploy to gh-pages
        run: |
          cd /tmp/web-build
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ExpoFontLoader.isLoaded crash on web"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
