name: Build and Deploy to gh-pages

on:
  push:
    branches: ["claude/steady-inventory-app-FEc00"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/steady-inventory-app-FEc00

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Patch expo-font FontLoader.js
        run: |
          FONTLOADER=node_modules/expo-font/build/FontLoader.js
          if [ -f "$FONTLOADER" ]; then
            sed -i 's/if (typeof ExpoFontLoader.isLoaded !== .function.)/if (typeof ExpoFontLoader?.isLoaded !== "function")/g' "$FONTLOADER"
            node -e "var fs=require('fs'); var c=fs.readFileSync('$FONTLOADER','utf8'); c=c.replace(/new Error[(][^)]*[)]/g,'null'); fs.writeFileSync('$FONTLOADER',c); console.log('patched FontLoader.js');"
          else
            echo "FontLoader.js not found"
          fi

      - name: Patch expo-font ExpoFontLoader.web.js
        run: |
          TARGET=node_modules/expo-font/build/ExpoFontLoader.web.js
          if [ -f "$TARGET" ]; then
            cp scripts/ExpoFontLoader.web.patch.js "$TARGET"
            echo "Patched $TARGET"
          else
            echo "NOT FOUND: $TARGET"
          fi

      - name: Shim registerWebModule in expo-modules-core
        run: |
          SHIM='if(!exports.registerWebModule){exports.registerWebModule=function(c){return c;}}'
          for F in $(find node_modules/expo-modules-core/build -name "*.web.js" 2>/dev/null); do
            if ! grep -q "registerWebModule" "$F"; then
              echo "" >> "$F"
              echo "$SHIM" >> "$F"
              echo "shimmed $F"
            fi
          done
          for F in node_modules/expo-modules-core/build/index.web.js node_modules/expo-modules-core/build/web/index.js; do
            if [ -f "$F" ] && ! grep -q "registerWebModule" "$F"; then
              echo "" >> "$F"
              echo "$SHIM" >> "$F"
              echo "shimmed $F"
            fi
          done

      - name: Build Expo web
        run: npx expo export -p web --output-dir /tmp/web-build --clear
        env:
          CI: "false"

      - name: Inject registerWebModule polyfill into bundle
        run: |
          JS=$(find /tmp/web-build/_expo/static/js/web -name "AppEntry-*.js" 2>/dev/null | head -1)
          if [ -n "$JS" ] && grep -q "registerWebModule" "$JS"; then
            cat scripts/registerWebModule.polyfill.js "$JS" > /tmp/patched.js
            mv /tmp/patched.js "$JS"
            echo "polyfill injected into $JS"
          else
            echo "no registerWebModule call found or JS missing"
          fi

      - name: Patch asset paths
        run: |
          cd /tmp/web-build
          JS=$(find _expo/static/js/web -name "AppEntry-*.js" 2>/dev/null | head -1)
          if [ -n "$JS" ]; then
            sed -i 's|"/assets/|"/Steady/assets/|g' "$JS"
            sed -i 's|"/_expo/|"/Steady/_expo/|g' "$JS"
            echo "patched $JS"
          fi
          sed -i 's|src="/_expo/|src="_expo/|g' index.html
          sed -i 's|href="/_expo/|href="_expo/|g' index.html
          sed -i 's|href="/assets/|href="assets/|g' index.html

      - name: Deploy to gh-pages
        run: |
          cd /tmp/web-build
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: registerWebModule polyfill + stable web deploy"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
