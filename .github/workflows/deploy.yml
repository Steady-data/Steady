name: Build and Deploy to gh-pages

on:
  push:
      branches: ["claude/steady-inventory-app-FEc00"]
        workflow_dispatch:

        permissions:
          contents: write

          jobs:
            build-and-deploy:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                  with:
                                            ref: claude/steady-inventory-app-FEc00

                                                  - uses: actions/setup-node@v4
                                                          with:
                                                                    node-version: "20"
                                                                              cache: npm

                                                                                    - run: npm ci --legacy-peer-deps

                                                                                          - name: Patch expo-font FontLoader.js - guard isLoaded check
                                                                                                  run: |
                                                                                                            FONTLOADER=node_modules/expo-font/build/FontLoader.js
                                                                                                                      if [ -f "$FONTLOADER" ]; then
                                                                                                                                  sed -i 's/if (typeof ExpoFontLoader\.isLoaded !== .function.)/if (typeof ExpoFontLoader?.isLoaded !== "function")/g' "$FONTLOADER"
                                                                                                                                              node -e "var fs=require('fs'); var c=fs.readFileSync('$FONTLOADER','utf8'); c=c.replace(/new Error\(.expected ExpoFontLoader\.isLoaded[^)]*\)/g, 'null'); fs.writeFileSync('$FONTLOADER',c); console.log('patched FontLoader.js');"
                                                                                                                                                        else
                                                                                                                                                                    echo "FontLoader.js not found"
                                                                                                                                                                              fi
                                                                                                                                                                              
                                                                                                                                                                                    - name: Patch expo-font ExpoFontLoader.web.js
                                                                                                                                                                                            run: |
                                                                                                                                                                                                      TARGET=node_modules/expo-font/build/ExpoFontLoader.web.js
                                                                                                                                                                                                                if [ -f "$TARGET" ]; then
                                                                                                                                                                                                                            cp scripts/ExpoFontLoader.web.patch.js "$TARGET"
                                                                                                                                                                                                                                        echo "Patched $TARGET"
                                                                                                                                                                                                                                                  else
                                                                                                                                                                                                                                                              echo "NOT FOUND: $TARGET"
                                                                                                                                                                                                                                                                          find node_modules/expo-font/build -name "*.js" | head -10
                                                                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                          - name: Patch expo-modules-core web - add registerWebModule shim
                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                            node -e "
                                                                                                                                                                                                                                                                                                                        var fs = require('fs');
                                                                                                                                                                                                                                                                                                                                    var path = require('path');
                                                                                                                                                                                                                                                                                                                                                // Find expo-modules-core web entry points and add registerWebModule if missing
                                                                                                                                                                                                                                                                                                                                                            var candidates = [
                                                                                                                                                                                                                                                                                                                                                                          'node_modules/expo-modules-core/build/index.web.js',
                                                                                                                                                                                                                                                                                                                                                                                        'node_modules/expo-modules-core/build/web/index.js',
                                                                                                                                                                                                                                                                                                                                                                                                      'node_modules/expo-modules-core/src/index.web.ts'
                                                                                                                                                                                                                                                                                                                                                                                                                  ];
                                                                                                                                                                                                                                                                                                                                                                                                                              var shim = '\nif (!exports.registerWebModule) { exports.registerWebModule = function(cls, name) { return cls; }; }\n';
                                                                                                                                                                                                                                                                                                                                                                                                                                          candidates.forEach(function(f) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (fs.existsSync(f)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var c = fs.readFileSync(f, 'utf8');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!c.includes('registerWebModule')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fs.appendFileSync(f, shim);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            console.log('Added registerWebModule shim to ' + f);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              console.log('registerWebModule already present in ' + f);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Also check main package entry
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                var pkgPath = 'node_modules/expo-modules-core/package.json';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (fs.existsSync(pkgPath)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          var pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var main = pkg.main || 'index.js';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      var mainWeb = (pkg.browser && pkg.browser[main]) || main;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    var resolved = path.join('node_modules/expo-modules-core', mainWeb);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (fs.existsSync(resolved)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var c = fs.readFileSync(resolved, 'utf8');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!c.includes('registerWebModule')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    fs.appendFileSync(resolved, shim);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log('Added registerWebModule shim to main: ' + resolved);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # Broad fallback: patch any expo-modules-core build file that's used on web
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              find node_modules/expo-modules-core/build -name "*.web.js" | while read f; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if ! grep -q "registerWebModule" "$f"; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "" >> "$f"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "if (!exports.registerWebModule) { exports.registerWebModule = function(cls, name) { return cls; }; }" >> "$f"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "Shimmed registerWebModule into $f"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Build Expo web
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: npx expo export -p web --output-dir /tmp/web-build --clear
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          CI: "false"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Patch registerWebModule in built bundleModule=function(cls,name){return cls;};}},id,deps);};}}})();';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                code = polyfill + '\n' + code;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fs.writeFileSync('$JS', code);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.log('Injected registerWebModule polyfill into bundle');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              console.log('registerWebModule already handled or not found, skipping polyfill');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Patch asset paths
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cd /tmp/web-build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    JS=$(find _expo/static/js/web -name "AppEntry-*.js" 2>/dev/null | head -1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ -n "$JS" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          sed -i 's|"/assets/|"/Steady/assets/|g' "$JS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sed -i 's|"/_expo/|"/Steady/_expo/|g' "$JS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "Patched $JS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sed -i 's|src="/_expo/|src="_expo/|g' index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sed -i 's|href="/_expo/|href="_expo/|g' index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          sed -i 's|href="/assets/|href="assets/|g' index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Deploy to gh-pages
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cd /tmp/web-build
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            touch .nojekyll
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      git init -b gh-pages
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git add -A
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              git commit -m "fix: registerWebModule polyfill + stable web deploy"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  JS=$(find /tmp/web-build/_expo/static/js/web -name "AppEntry-*.js" 2>/dev/null | head -1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if [ -n "$JS" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        node -e "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      var fs = require('fs');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    var code = fs.readFileSync('$JS', 'utf8');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (code.includes('registerWebModule') && !code.includes('registerWebModule=function')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Inject polyfill at the very beginning of the bundle
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var polyfill = '(function(){if(typeof globalThis.__registerWebModulePolyfilled===\"undefined\"){globalThis.__registerWebModulePolyfilled=true;var origD=globalThis.__d;if(origD){globalThis.__d=function(factory,id,deps){origD(function(g,r,i,a,m,e,d){var modExports={};try{factory(g,r,i,a,m,e,d);}catch(err){throw err;}if(e&&typeof e.registerWebModule===\"undefined\"){e.registerWeb
